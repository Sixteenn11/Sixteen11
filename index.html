<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Wedding</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="loading-screen">

        <div class="loader">

            <!-- OUTER GREEN CIRCLE -->
            <svg class="green-loader" viewBox="0 0 160 160">

                <!-- Cream underneath -->
                <circle
                    class="cream-circle"
                    cx="80"
                    cy="80"
                    r="72">
                </circle>

                <!-- Green 75% arc -->
                <circle
                    class="green-circle"
                    cx="80"
                    cy="80"
                    r="72">
                </circle>

            </svg>


            <!-- INNER RED CIRCLE -->
            <svg class="red-loader" viewBox="0 0 140 140">

                <!-- Cream underneath -->
                <circle
                    class="cream-circle"
                    cx="70"
                    cy="70"
                    r="58">
                </circle>

                <!-- Red 75% arc -->
                <circle
                    class="red-circle"
                    cx="70"
                    cy="70"
                    r="58">
                </circle>

            </svg>


            <!-- CENTER LOGO -->
            <img
                src="./Loding Monogram.svg"
                alt="Wedding Monogram"
                class="monogram">

        </div>

    </div>


    <script src="./script.js"></script>

</body>

</html>
